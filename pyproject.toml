[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nrlx"
version = "0.2.1"
description = "NRL eXtended: tools for building and validating seismic instrument responses."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Vishnuraj Sreeraj Nair", email = "vishnurajsreeraj@yahoo.com" }
]

keywords = [
    "seismology",
    "nominal response library",
    "NRL",
    "ObsPy",
    "StationXML",
    "RESP",
    "instrument response"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.19",
    "rich>=13.0",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "msgspec>=0.18",
    "obspy>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]
plot = [
    "matplotlib>=3.8",
]

[project.scripts]
nrlx = "nrlx.tools.cmd:app"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

# obspy has no type stubs
[[tool.mypy.overrides]]
module = ["obspy", "obspy.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/vishnurajsreerajnair/nrlx"
Repository = "https://github.com/vishnurajsreerajnair/nrlx"
Issues = "https://github.com/vishnurajsreerajnair/nrlx/issues"