[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nrlx"
version = "0.1.dev2"
description = "NRL eXtended: tools for building and validating seismic instrument responses."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Vishnuraj Sreeraj Nair", email = "vishnurajsreeraj@yahoo.com" }
]

keywords = [
    "seismology",
    "nominal response library",
    "NRL",
    "ObsPy",
    "StationXML",
    "RESP",
    "instrument response"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "platformdirs>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
obspy = [
    "obspy>=1.4",
]
plot = [
    "matplotlib>=3.8",
]

[project.scripts]
nrlx = "nrlx.cli:app"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

# obspy is an optional extra without type stubs; its import lives behind the
# lazy loader in nrlx.inventory.
[[tool.mypy.overrides]]
module = ["obspy", "obspy.*"]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/vishnurajsreerajnair/nrlx"
Repository = "https://github.com/vishnurajsreerajnair/nrlx"
Issues = "https://github.com/vishnurajsreerajnair/nrlx/issues"